name: Netlify build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfile uses public npm registry
        run: |
          if grep -q 'registry.npmjs.intuit.com' package-lock.json; then
            echo "::error::package-lock.json contains Intuit registry URLs."
            echo "Regenerate with: rm -rf node_modules package-lock.json && npm install"
            echo "Ensure .npmrc sets registry=https://registry.npmjs.org/"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Next.js collects page data at build time; dummy values satisfy imports.
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          MONGODB_DB: creditspend
          AUTH_SECRET: ci-build-secret-minimum-32-characters
          OPENAI_API_KEY: sk-ci-placeholder
